function buildScratchpad(n,form,controls,isDrawing){const details=document.createElement('section');details.className='scratchpad';const summary=document.createElement('h3');summary.className='scratch-title';summary.textContent='✎ Черновик';const toolbar=document.createElement('div');toolbar.className='scratch-tools';toolbar.setAttribute('role','group');toolbar.setAttribute('aria-label','Инструменты черновика');const pencil=document.createElement('button'),eraser=document.createElement('button'),clear=document.createElement('button');for(const b of [pencil,eraser,clear])b.type='button';pencil.textContent='✎ Карандаш';eraser.textContent='▱ Ластик';clear.textContent='🗑 Корзина';clear.setAttribute('aria-label','Очистить черновик этого задания');pencil.setAttribute('aria-pressed','true');eraser.setAttribute('aria-pressed','false');toolbar.append(pencil,eraser,clear);const canvas=document.createElement('canvas');canvas.width=800;canvas.height=300;canvas.setAttribute('aria-label','Черновик задания '+(n+1)+'. Рисуйте мышью, пальцем или стилусом.');const note=document.createElement('p');note.className='scratch-note';note.textContent=isDrawing?'Здесь можно выполнить чертёж. Чертёж проверяется самостоятельно.':'Для вычислений и заметок. Записи сохраняются отдельно для каждого задания.';details.append(summary,note,canvas,toolbar);form.append(details);const c=canvas.getContext('2d');c.lineCap='round';c.lineJoin='round';let tool='pencil',active=false,revision=0;function selectTool(next){tool=next;pencil.setAttribute('aria-pressed',String(next==='pencil'));eraser.setAttribute('aria-pressed',String(next==='eraser'));canvas.style.cursor=next==='eraser'?'cell':'crosshair'}pencil.onclick=()=>selectTool('pencil');eraser.onclick=()=>selectTool('eraser');const point=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};const persist=()=>{taskProgress[n]={...taskProgress[n],values:controls.map(e=>e.value),drawing:canvas.toDataURL()};storeTasks()};const drawing=taskProgress[n]?.drawing;if(typeof drawing==='string'&&drawing.startsWith('data:image/png;base64,')){const im=new Image();im.onload=()=>{if(revision===0)c.drawImage(im,0,0)};im.src=drawing}canvas.onpointerdown=e=>{e.preventDefault();revision++;active=true;canvas.setPointerCapture(e.pointerId);c.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';c.strokeStyle='#193d30';c.lineWidth=tool==='eraser'?30:3;const[x,y]=point(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.01,y+.01);c.stroke()};canvas.onpointermove=e=>{if(!active)return;e.preventDefault();c.lineTo(...point(e));c.stroke()};const finish=()=>{if(active){active=false;persist()}};canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=finish;clear.onclick=()=>{revision++;active=false;c.clearRect(0,0,canvas.width,canvas.height);persist()};selectTool('pencil')}
function buildLineMatching(task,answers,controls){
 const ns='http://www.w3.org/2000/svg',board=document.createElement('div');board.className='line-matching';
 const storage=document.createElement('div');storage.className='matching-storage';storage.hidden=true;storage.append(...answers.children);answers.append(storage,board);
 const wires=document.createElementNS(ns,'svg');wires.classList.add('matching-wires');wires.setAttribute('aria-hidden','true');
 const left=document.createElement('div'),right=document.createElement('div'),status=document.createElement('p');left.className=right.className='matching-side';status.className='matching-status';status.setAttribute('role','status');status.textContent='Соедини все четыре рисунка с названиями.';
 board.append(wires,left,right);answers.append(status);
 const shapes=[
  '<path d="M25 22 L151 57 M141 47 L151 57 L137 59"/><circle cx="25" cy="22" r="4" fill="currentColor"/>',
  '<path d="M20 22 L160 58 M24 33 L20 22 L33 20 M147 60 L160 58 L154 46"/>',
  '<path d="M25 22 L155 58"/><circle cx="25" cy="22" r="4" fill="currentColor"/><circle cx="155" cy="58" r="4" fill="currentColor"/>',
  '<path d="M18 52 C48 -15 70 90 103 40 S143 20 163 50"/>'
 ];
 const names=['Отрезок','Кривая','Прямая','Луч'],sources=[],targets=[];let selected=null,suppressClick=false;
 function path(x1,y1,x2,y2,color,preview=false){const line=document.createElementNS(ns,'path');const bend=Math.max(24,Math.abs(x2-x1)*.4);line.setAttribute('d',`M${x1} ${y1} C${x1+bend} ${y1},${x2-bend} ${y2},${x2} ${y2}`);line.setAttribute('stroke',color);line.setAttribute('fill','none');line.setAttribute('stroke-width','3');if(preview)line.setAttribute('stroke-dasharray','5 5');wires.append(line)}
 function draw(pointer){if(!board.isConnected)return;const r=board.getBoundingClientRect();wires.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);wires.replaceChildren();sources.forEach((source,i)=>{const value=controls[i].value,invalid=controls[i].getAttribute('aria-invalid'),color=invalid==='true'?'#ff7770':invalid==='false'?'#8fe1a0':'#ffd08c';source.classList.toggle('selected',selected===i);source.setAttribute('aria-pressed',String(selected===i));source.disabled=controls[i].disabled;source.dataset.result=invalid===null?'':invalid==='true'?'wrong':'correct';source.setAttribute('aria-label',`Рисунок ${i+1}${value?', соединён: '+value:''}`);if(value){const target=targets[names.indexOf(value)];if(target){const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();path(a.right-r.left,a.top+a.height/2-r.top,b.left-r.left,b.top+b.height/2-r.top,color)}}});targets.forEach(target=>{const i=controls.findIndex(input=>input.value===target.dataset.name);target.disabled=controls.every(input=>input.disabled);target.dataset.result=i<0?'':controls[i].getAttribute('aria-invalid')==='true'?'wrong':controls[i].getAttribute('aria-invalid')==='false'?'correct':'linked'});if(pointer&&selected!==null){const a=sources[selected].getBoundingClientRect();path(a.right-r.left,a.top+a.height/2-r.top,pointer.x-r.left,pointer.y-r.top,'#ffd08c',true)}}
 function choose(i){if(controls[i].disabled)return;selected=i;status.textContent=`Рисунок ${i+1} выбран. Выбери название справа.`;draw()}
 function connect(name){if(selected===null){status.textContent='Сначала выбери рисунок слева.';return}const i=selected;controls.forEach((input,j)=>{if(j!==i&&input.value===name){input.value='';input.dispatchEvent(new Event('input',{bubbles:true}))}});controls[i].value=name;controls[i].dispatchEvent(new Event('input',{bubbles:true}));selected=null;status.textContent=`Рисунок ${i+1} соединён: ${name}. Соединено ${controls.filter(input=>input.value).length} из 4.`;draw()}
 shapes.forEach((shape,i)=>{const button=document.createElement('button');button.type='button';button.className='matching-source';button.innerHTML=`<span class="matching-number">${i+1}</span><svg viewBox="0 0 180 80" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${shape}</svg>`;button.onclick=()=>{if(!suppressClick)choose(i)};let dragging=false;button.onpointerdown=e=>{if(button.disabled||e.button!==0)return;choose(i);dragging=true;button.setPointerCapture(e.pointerId)};button.onpointermove=e=>{if(dragging)draw({x:e.clientX,y:e.clientY})};button.onpointerup=e=>{if(!dragging)return;dragging=false;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.matching-target');if(target&&board.contains(target)){connect(target.dataset.name);suppressClick=true;setTimeout(()=>suppressClick=false,0)}draw()};button.onpointercancel=()=>{dragging=false;draw()};left.append(button);sources.push(button)});
 names.forEach(name=>{const button=document.createElement('button');button.type='button';button.className='matching-target';button.dataset.name=name;button.textContent=name;button.onclick=()=>connect(name);right.append(button);targets.push(button)});
 const observer=new MutationObserver(()=>draw());controls.forEach(input=>observer.observe(input,{attributes:true,attributeFilter:['aria-invalid','disabled']}));new ResizeObserver(()=>draw()).observe(board);requestAnimationFrame(()=>draw());
}
function buildTask(n){const task=tasks[n],host=$('task-content');host.replaceChildren();host.hidden=false;if(task.image){const image=document.createElement('img');image.className='task-illustration';image.src=task.image;image.alt=task.imageAlt;host.append(image)}const form=document.createElement('form');form.noValidate=true;form.className='task-form'+(task.fields.length===1?' single-answer':'');const saved=taskProgress[n]||{};const controls=[];task.fields.forEach(([label,answer,options],i)=>{const row=document.createElement('label');row.className='answer-row';const caption=document.createElement('span');caption.textContent=label;const input=document.createElement(task.compare||options?'select':'input');input.id=`answer-${n}-${i}`;input.required=true;if(input.tagName==='SELECT'){const blank=new Option('Выбери…','');input.add(blank);for(const value of (task.compare?['>','<','=']:options))input.add(new Option(value,value))}else{input.type='text';input.inputMode=task.sequence||task.expressions?'text':'decimal';input.autocomplete='off';input.placeholder='Ответ'}input.value=Array.isArray(saved.values)?saved.values[i]||'':'';input.disabled=!!saved.solved;const checked=saved.solved?true:saved.checked?.[i];if(typeof checked==='boolean')input.setAttribute('aria-invalid',String(!checked));row.append(caption,input);const gaps=label.match(/[□…]/g)||[];if(gaps.length===1){const [before,after]=label.split(/[□…]/);row.classList.add('inline-answer');caption.textContent=before.trim();const suffix=document.createElement('span');suffix.textContent=after.trim();row.append(suffix);input.setAttribute('aria-label',label.replace(/[□…]/,'пропуск'));if(input.tagName==='INPUT')input.placeholder='';else input.options[0].textContent='?'}else if(!task.compare&&!options&&/^[\d\s+−–×÷:*/().-]+$/.test(label)&&/[+−–×÷:*/-]/.test(label)){row.classList.add('inline-answer','calculation-answer');caption.textContent=label+' =';input.placeholder='';input.setAttribute('aria-label',label+' равно')}if(task.fields.length===1&&!row.classList.contains('inline-answer')){row.classList.add('answer-bar');caption.classList.add('visually-hidden');const unit=document.createElement('span');unit.className='answer-unit';unit.textContent=label.match(/(?:, )(кг|л|см|см²)$/)?.[1]||(label==='Деревянных домов'?'домов':label==='Во сколько раз?'?'раз':'');row.append(unit)}form.append(row);controls.push(input);input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');row.classList.remove('incorrect');taskProgress[n]={values:controls.map(e=>e.value),solved:false,checked:controls.map(e=>e.hasAttribute('aria-invalid')?e.getAttribute('aria-invalid')==='false':null),drawing:taskProgress[n]?.drawing};storeTasks()})});
placeSequenceGaps(task,form,controls);
const answers=document.createElement('div');answers.className='task-answers';if(!task.gapRows&&controls.length>1&&controls.every(input=>input.closest('.answer-row').classList.contains('inline-answer')))answers.classList.add('two-columns');if(task.sequence)answers.classList.add('ordered-sequences');if(task.image&&controls.length>1)answers.classList.add('matching-answers');answers.append(...form.children);form.append(answers);if(task.matching)buildLineMatching(task,answers,controls);
buildScratchpad(n,form,controls,task.drawing);
const feedback=document.createElement('p');feedback.className='task-feedback'+(saved.solved?' success':'');feedback.setAttribute('role','status');const check=document.createElement('button');check.type='submit';check.className='check-task';check.textContent=saved.solved?'✓ Задание выполнено':'Проверить';check.disabled=!!saved.solved;feedback.textContent=saved.solved?'Верно! Все ответы сохранены.':'';form.append(check,feedback);form.onsubmit=e=>{e.preventDefault();let correct=true;controls.forEach((input,i)=>{const normalize=task.sequence?v=>String(v).trim().replace(/[\s;,]+/g,','):normalizeAnswer;const ok=normalize(input.value)===normalize(task.fields[i][1]);input.setAttribute('aria-invalid',String(!ok));input.parentElement.classList.toggle('incorrect',!ok);if(!ok)correct=false});taskProgress[n]={...taskProgress[n],values:controls.map(e=>e.value),checked:controls.map(e=>e.getAttribute('aria-invalid')==='false'),solved:correct};storeTasks();feedback.textContent=correct?'Верно! Задание выполнено.':'Проверь выделенные ответы и попробуй ещё раз.';feedback.classList.toggle('success',correct);feedback.scrollIntoView({block:'nearest',behavior:'smooth'});if(correct){controls.forEach(i=>i.disabled=true);check.disabled=true;check.textContent='✓ Задание выполнено';tone()}};host.append(form)}

function showWindowContent(i){$('modal').classList.remove('victory-card');const gift=i%2===0;$('modal-icon').textContent=gift?'🎁':'✉️';$('modal-kicker').textContent=`СЮРПРИЗ ${windowNumber(i)}`;$('modal-title').textContent=gift?'Маленькая радость для тебя':'Добавим немного волшебства';const n=Math.floor(i/2);$('task-content').replaceChildren();$('task-content').hidden=gift;$('modal').classList.toggle('task-card',!gift);$('close').textContent=gift?'Чудесно!':'×';$('close').setAttribute('aria-label',gift?'Закрыть подарок':'Закрыть задание');if(gift){const item=giftItems[n];$('gift-item').hidden=!item;$('modal-icon').hidden=!!item;if(item){$('gift-item').src=item.image;$('gift-item').alt=item.title;$('modal-title').textContent=item.title}$('modal-text').textContent=item?item.caption:giftTexts[n];$('modal-text').hidden=false}else{$('gift-item').hidden=true;$('modal-icon').hidden=false;$('modal-title').textContent=tasks[n].title;$('modal-text').textContent=tasks[n].text||'';$('modal-text').hidden=!tasks[n].text;buildTask(n)}$('modal').show();$('close').focus()}
function openWindow(i){if($('modal').open||reactionActive)return;const fresh=!opened.has(i),gift=i%2===0;opened.add(i);save();render();if(fresh){tone();if(gift)confetti()}if(opened.size===40)$('hint').textContent='✦ Все 40 окошек открыты! Пусть волшебство останется с тобой.';if(fresh)playReaction(gift?'gift-reaction':'task-reaction',()=>showWindowContent(i));else showWindowContent(i)}
function allGiftsOpened(){return Array.from({length:20},(_,n)=>n*2).every(i=>opened.has(i))}
function showVictoryCard(){$('modal').classList.remove('task-card');$('modal').classList.add('victory-card');$('gift-item').hidden=true;$('modal-icon').hidden=false;$('modal-icon').textContent='🏆';$('modal-kicker').textContent='ВСЕ 20 ПОДАРКОВ СОБРАНЫ';$('modal-title').textContent='Поздравляем!';$('modal-text').hidden=false;$('modal-text').textContent='Ты нашёл все подарки! Пусть новогодние чудеса продолжаются. Если остались задания, их можно решить в своём темпе.';$('task-content').replaceChildren();$('task-content').hidden=true;$('close').textContent='Продолжить игру';$('close').setAttribute('aria-label','Закрыть поздравление');$('modal').show();$('close').focus();confetti()}
function checkVictory(){if(victoryPlayed||!allGiftsOpened()||$('modal').open||$('reset-confirm').open)return;if(reactionActive)stopReaction();victoryPlayed=true;save();playReaction('victory-reaction',showVictoryCard)}
$('modal').addEventListener('close',checkVictory);
const video=$('greeting'),playButton=$('play-video');video.loop=false;playButton.onclick=async()=>{if(video.paused){if(video.ended)video.currentTime=0;try{await video.play()}catch{$('video-status').textContent='Не удалось запустить видео. Попробуй нажать ещё раз.'}}else video.pause()};video.addEventListener('play',()=>{playButton.textContent='Ⅱ Пауза';$('video-status').textContent=soundOn?'Слушай приветствие героя':'Видео без звука · включи звук кнопкой сверху'});video.addEventListener('pause',()=>{playButton.textContent=video.ended?'↻ Посмотреть ещё раз':'▶ Продолжить приветствие'});video.addEventListener('ended',()=>{playButton.textContent='↻ Посмотреть ещё раз';$('video-status').textContent='А теперь выбирай подарок справа!';checkVictory()});video.addEventListener('error',()=>{$('video-status').textContent='Видео не загрузилось. Подарки по-прежнему можно открывать.'});
$('sound').onclick=()=>{soundOn=!soundOn;if(!soundOn&&ctx)ctx.suspend().catch(()=>{});updateSound();save();if(soundOn)tone()};$('close').onclick=()=>{$('modal').close();checkVictory()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').open)$('modal').close()});$('modal').onclick=e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}};function resetGame(){const d=$('reset-confirm');d.returnValue='cancel';if(!d.open)d.showModal()}function performReset(){stopReaction();video.pause();video.currentTime=0;if(ctx){const old=ctx;ctx=undefined;old.close().catch(()=>{})}document.querySelectorAll('.confetti').forEach(e=>e.remove());if($('modal').open)$('modal').close();opened.clear();windowOrder=shuffleWindows();victoryPlayed=false;taskProgress={};storeTasks();save();render();$('hint').textContent='';video.play().catch(()=>{$('video-status').textContent='Нажми, чтобы запустить приветствие';playButton.textContent='▶ Смотреть приветствие'})} $('reset-confirm').addEventListener('close',()=>{if($('reset-confirm').returnValue==='restart')performReset()});$('reset').onclick=resetGame;save();render();updateSound();video.play().catch(()=>{$('video-status').textContent='Нажми, чтобы запустить приветствие';playButton.textContent='▶ Смотреть приветствие'});if(opened.size===40)$('hint').textContent='✦ Все 40 окошек открыты! Пусть волшебство останется с тобой.';

$('play-victory').onclick=()=>{if($('modal').open)$('modal').close();stopReaction();victoryPlayed=false;checkVictory()};
if(allGiftsOpened()&&!victoryPlayed)checkVictory();

// Mirror the current frame's narrow outer edge into the exposed margin.
// This keeps the shifted video seamless without a second image of the cat.
(()=>{const scene=document.querySelector('.scene'),edge=document.createElement('canvas');edge.className='scene-edge';edge.setAttribute('aria-hidden','true');edge.width=64;scene.prepend(edge);const context=edge.getContext('2d');let previousVideo,previousTime=-1;function paint(){if(matchMedia('(min-width:701px)').matches&&!document.hidden){const active=scene.querySelector('.reaction-video:not([hidden])')||video;if(active.readyState>=2&&(active!==previousVideo||active.currentTime!==previousTime)){if(edge.height!==active.videoHeight)edge.height=active.videoHeight;const sourceWidth=active.videoWidth*edge.getBoundingClientRect().width/scene.clientWidth;context.setTransform(-1,0,0,1,edge.width,0);context.drawImage(active,0,0,sourceWidth,active.videoHeight,0,0,edge.width,edge.height);context.setTransform(1,0,0,1,0,0);previousVideo=active;previousTime=active.currentTime;}}requestAnimationFrame(paint)}paint()})();
